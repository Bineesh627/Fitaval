name: Fitaval CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Lint Check
        run: npm run lint

      - name: Unit & Integration Tests
        run: npm run test
        env:
          NODE_OPTIONS: "--require ./scripts/node20-zlib-compat.cjs"

      - name: Production Bundle Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.fitaval.com/api/v1
          VITE_ENABLE_MOCK_API: 'false'
          VITE_APP_ENV: production

